x-kafka-brokers: &kafka-brokers "kafka-1:29092,kafka-2:29092,kafka-3:29092"

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}

x-producer-env: &producer-env
  KAFKA_BROKER: *kafka-brokers
  SYMBOLS: ${SYMBOLS:-AAPL,MSFT,GOOG}
  CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
  CRYPTO_SYMBOLS_SHARD: ${CRYPTO_SYMBOLS_SHARD:-}
  POLL_INTERVAL: ${POLL_INTERVAL:-60}
  POLL_BACKOFF: ${POLL_BACKOFF:-300}
  PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-5}

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3access}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-s3secret}

x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:24.8
  restart: unless-stopped
  depends_on:
    clickhouse-keeper:
      condition: service_healthy
    s3proxy:
      condition: service_healthy
    s3proxy-init:
      condition: service_completed_successfully
  environment:
    <<: *clickhouse-env
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  mem_limit: 3g
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  networks: [streaming]

x-producer: &producer
  build: ./producers
  image: producers:local
  pull_policy: build
  restart: unless-stopped
  environment: *producer-env
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  networks: [streaming]

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SNAPSHOT_TRUST_EMPTY: "true"
    volumes:
      - ./volumes/zookeeper-data:/var/lib/zookeeper/data
      - ./volumes/zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [streaming]

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
    volumes:
      - ./volumes/kafka-data-1:/var/lib/kafka/data
      - ./init/kafka/create-topics.sh:/etc/kafka/create-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [streaming]

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_PORT_2:-29093}:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:${KAFKA_PORT_2:-29093}
    volumes:
      - ./volumes/kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [streaming]

  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_PORT_3:-29094}:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:${KAFKA_PORT_3:-29094}
    volumes:
      - ./volumes/kafka-data-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [streaming]

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./init/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    environment:
      KAFKA_BROKER: *kafka-brokers
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
    restart: "no"
    networks: [streaming]

  # ==========================================
  # CLICKHOUSE CLUSTER (2 shards x 2 replicas)
  # ==========================================
  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: clickhouse-keeper
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - clickhouse_keeper_data:/var/lib/clickhouse-keeper
      - ./configs/clickhouse/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9181' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [streaming]

  # S3-compatible cold tier. S3Proxy buckets are directories under /data.
  s3proxy:
    image: andrewgaul/s3proxy:2.6.0
    container_name: s3proxy
    restart: unless-stopped
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: ${S3_ACCESS_KEY:-s3access}
      S3PROXY_CREDENTIAL: ${S3_SECRET_KEY:-s3secret}
    mem_limit: 512m
    volumes:
      - s3proxy_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/80' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [streaming]

  s3proxy-init:
    image: andrewgaul/s3proxy:2.6.0
    container_name: s3proxy-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/clickhouse"]
    volumes:
      - s3proxy_data:/data
    networks: [streaming]

  # Shard 1, replica 1. Also the cluster entry point for Flink and Grafana;
  # queries on its Distributed tables fan out across all four nodes.
  clickhouse:
    <<: *clickhouse
    container_name: clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_SHARD: "1"
      CLICKHOUSE_REPLICA: "1"
      CLICKHOUSE_S3_ENDPOINT: http://s3proxy/clickhouse/clickhouse/
    volumes:
      - clickhouse_data_1:/var/lib/clickhouse
      - ./configs/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/experimental.xml:ro

  clickhouse-2:
    <<: *clickhouse
    container_name: clickhouse-2
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_SHARD: "1"
      CLICKHOUSE_REPLICA: "2"
      CLICKHOUSE_S3_ENDPOINT: http://s3proxy/clickhouse/clickhouse-2/
    volumes:
      - clickhouse_data_2:/var/lib/clickhouse
      - ./configs/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/experimental.xml:ro

  clickhouse-3:
    <<: *clickhouse
    container_name: clickhouse-3
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_SHARD: "2"
      CLICKHOUSE_REPLICA: "1"
      CLICKHOUSE_S3_ENDPOINT: http://s3proxy/clickhouse/clickhouse-3/
    volumes:
      - clickhouse_data_3:/var/lib/clickhouse
      - ./configs/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/experimental.xml:ro

  clickhouse-4:
    <<: *clickhouse
    container_name: clickhouse-4
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_SHARD: "2"
      CLICKHOUSE_REPLICA: "2"
      CLICKHOUSE_S3_ENDPOINT: http://s3proxy/clickhouse/clickhouse-4/
    volumes:
      - clickhouse_data_4:/var/lib/clickhouse
      - ./configs/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/experimental.xml:ro

  # One schema run after all four servers are healthy. Refreshable MVs cannot
  # be created with ON CLUSTER on 24.8 (the DDL worker crashes), so the MV is
  # created on each node separately.
  clickhouse-schema:
    image: clickhouse/clickhouse-server:24.8
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-2:
        condition: service_healthy
      clickhouse-3:
        condition: service_healthy
      clickhouse-4:
        condition: service_healthy
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./init/clickhouse:/init:ro
      - ./init/clickhouse-mv:/init-mv:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        engine=$$(clickhouse-client --host clickhouse --password "$$CLICKHOUSE_PASSWORD" \
          --query "SELECT engine FROM system.tables WHERE database='analytics' AND name='equities_prices'" 2>/dev/null || true)
        if [ -n "$$engine" ] && [ "$$engine" != "Distributed" ]; then
          echo "analytics.equities_prices is $$engine, not Distributed; use a fresh volume (make nuke)" >&2
          exit 1
        fi
        for f in /init/0[1-7]_*.sql; do
          echo "schema: $$f"
          clickhouse-client --host clickhouse --password "$$CLICKHOUSE_PASSWORD" --multiquery < "$$f"
        done
        for host in clickhouse clickhouse-2 clickhouse-3 clickhouse-4; do
          echo "indicators MV: $$host"
          clickhouse-client --host "$$host" --password "$$CLICKHOUSE_PASSWORD" --multiquery < /init-mv/08_indicators_mv.sql
        done
    networks: [streaming]

  grafana:
    image: grafana/grafana:11.4.2
    container_name: grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource 4.23.5"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    mem_limit: 512m
    volumes:
      - ./volumes/grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [streaming]

  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [streaming]

  mcp:
    build: ./mcp
    container_name: mcp
    restart: unless-stopped
    command:
      - --api-base-url
      - http://api:4000
      - --openapi-spec
      - http://api:4000/openapi/json
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "3001"
      - --exclude-tag
      - health
    ports:
      - "127.0.0.1:${MCP_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_started
    networks: [streaming]

  # ==========================================
  # PRODUCERS (one image, one process each)
  # ==========================================
  yahoo-producer:
    <<: *producer
    container_name: yahoo-producer
    command: python -m src.equities.yahoo_producer
    # Sharding is opt-in here only: fundamentals/insider/corporate run whole.
    environment:
      <<: *producer-env
      SYMBOLS_SHARD: ${SYMBOLS_SHARD:-}

  index-producer:
    <<: *producer
    container_name: index-producer
    command: python -m src.equities.index_producer

  options-producer:
    <<: *producer
    container_name: options-producer
    command: python -m src.equities.options_producer
    environment:
      <<: *producer-env
      OPTIONS_MAX_EXPIRIES: ${OPTIONS_MAX_EXPIRIES:-8}

  symbol-catalog-producer:
    <<: *producer
    container_name: symbol-catalog-producer
    command: python -m src.equities.symbol_catalog_producer
    environment:
      <<: *producer-env
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}

  institutional-producer:
    <<: *producer
    container_name: institutional-producer
    command: python -m src.equities.institutional_holdings_producer
    environment:
      <<: *producer-env
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}
      INSTITUTIONAL_CIKS: ${INSTITUTIONAL_CIKS:-0001067983}

  binance-producer:
    <<: *producer
    container_name: binance-producer
    command: python -m src.crypto.binance_ws_producer

  binance-ohlcv-producer:
    <<: *producer
    container_name: binance-ohlcv-producer
    command: python -m src.crypto.binance_ohlcv_producer

  forex-producer:
    <<: *producer
    container_name: forex-producer
    command: python -m src.forex.forex_producer

  coingecko-producer:
    <<: *producer
    container_name: coingecko-producer
    command: python -m src.crypto.coingecko_producer

  sec-edgar-producer:
    <<: *producer
    container_name: sec-edgar-producer
    command: python -m src.equities.sec_edgar_producer
    environment:
      KAFKA_BROKER: *kafka-brokers
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}

  corporate-actions-producer:
    <<: *producer
    container_name: corporate-actions-producer
    command: python -m src.equities.corporate_actions_producer

  fundamentals-producer:
    <<: *producer
    container_name: fundamentals-producer
    command: python -m src.equities.fundamentals_producer

  insider-producer:
    <<: *producer
    container_name: insider-producer
    command: python -m src.equities.insider_producer

  bls-producer:
    <<: *producer
    container_name: bls-producer
    command: python -m src.macro.bls_producer

  treasury-producer:
    <<: *producer
    container_name: treasury-producer
    command: python -m src.macro.treasury_producer

  commodities-producer:
    <<: *producer
    container_name: commodities-producer
    command: python -m src.macro.commodities_producer

  # Synthetic load for scaling tests: make load RATE=500 DURATION=60
  loadgen:
    <<: *producer
    container_name: loadgen
    profiles: [load]
    restart: "no"
    command: python -m src.loadgen --rate 500 --duration 60

  # ==========================================
  # FLINK CLUSTER
  # ==========================================
  jobmanager:
    build: ./flink-jobs
    image: flink-jobs:local
    pull_policy: build
    container_name: jobmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10 s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [streaming]

  taskmanager:
    build: ./flink-jobs
    image: flink-jobs:local
    pull_policy: build
    container_name: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: ${TASKMANAGER_SLOTS:-4}
        taskmanager.memory.process.size: 6g
        taskmanager.memory.task.off-heap.size: 1g
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    networks: [streaming]

  # One-shot job submission. Re-runs safely: it exits if a job is already
  # running instead of submitting a duplicate.
  flink-submit:
    build: ./flink-jobs
    image: flink-jobs:local
    pull_policy: build
    container_name: flink-submit
    depends_on:
      jobmanager:
        condition: service_healthy
      clickhouse-schema:
        condition: service_completed_successfully
    restart: "no"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-1}
      TASKMANAGER_SLOTS: ${TASKMANAGER_SLOTS:-4}
      CHECKPOINT_TIMEOUT_MS: ${CHECKPOINT_TIMEOUT_MS:-600000}
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-60000}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for _ in $(seq 1 60); do
          flink list -m jobmanager:8081 >/dev/null 2>&1 && break
          echo "waiting for Flink REST API"; sleep 2
        done
        groups=$$(python -c "import sys; sys.path.append('/opt/flink/usrlib/src'); import config; print(' '.join(config.TOPIC_GROUPS))")
        [ -n "$$groups" ] || { echo "no topic groups found; aborting" >&2; exit 1; }
        need=$$(python -c "import sys; sys.path.append('/opt/flink/usrlib/src'); import config; print(len(config.TOPIC_GROUPS) * config.parallelism())")
        if [ "$${TASKMANAGER_SLOTS}" -lt "$$need" ]; then
          echo "need $$need TaskManager slots (groups x parallelism); TASKMANAGER_SLOTS=$${TASKMANAGER_SLOTS}" >&2
          exit 1
        fi
        for group in $$groups; do
          name="Kafka_to_ClickHouse_$$group"
          if flink list -m jobmanager:8081 2>/dev/null | grep -q "$$name"; then
            echo "$$name already exists; skipping"
            continue
          fi
          echo "submitting $$name (java)"
          FLINK_GROUP=$$group flink run -d -m jobmanager:8081 \
            -c com.example.KafkaToClickHouse \
            /opt/flink/usrlib/flink-sink.jar \
            || { echo "failed to submit $$name" >&2; exit 1; }
        done
    networks: [streaming]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka-1:29092
      - --kafka.server=kafka-2:29092
      - --kafka.server=kafka-3:29092
      - --web.listen-address=:9308
      - '--topic.filter=^(equities|crypto|forex|macro|fundamentals)\..*$'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    networks: [streaming]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - kafka-exporter
    mem_limit: 512m
    networks: [streaming]

networks:
  streaming:
    driver: bridge

volumes:
  clickhouse_data_1:
  clickhouse_data_2:
  clickhouse_data_3:
  clickhouse_data_4:
  clickhouse_keeper_data:
  s3proxy_data:
  prometheus_data:
