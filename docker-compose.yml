x-kafka-brokers: &kafka-brokers "kafka-1:29092,kafka-2:29092,kafka-3:29092"

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

x-producer-env: &producer-env
  KAFKA_BROKER: *kafka-brokers
  SYMBOLS: ${SYMBOLS:-AAPL,MSFT,GOOG}
  CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
  CRYPTO_SYMBOLS_SHARD: ${CRYPTO_SYMBOLS_SHARD:-}
  POLL_INTERVAL: ${POLL_INTERVAL:-60}
  POLL_BACKOFF: ${POLL_BACKOFF:-300}
  PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-5}

x-producer: &producer
  build: ./producers
  image: producers:local
  pull_policy: build
  restart: unless-stopped
  environment: *producer-env
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  networks: [streaming]

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SNAPSHOT_TRUST_EMPTY: "true"
    volumes:
      - ./volumes/zookeeper-data:/var/lib/zookeeper/data
      - ./volumes/zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/2181' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [streaming]

  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-29092}:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
    volumes:
      - ./volumes/kafka-data-1:/var/lib/kafka/data
      - ./init/kafka/create-topics.sh:/etc/kafka/create-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [streaming]

  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT_2:-29093}:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:${KAFKA_PORT_2:-29093}
    volumes:
      - ./volumes/kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [streaming]

  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT_3:-29094}:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:${KAFKA_PORT_3:-29094}
    volumes:
      - ./volumes/kafka-data-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [streaming]

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./init/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    environment:
      KAFKA_BROKER: *kafka-brokers
    restart: "no"
    networks: [streaming]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [streaming]

  grafana:
    image: grafana/grafana:11.4.2
    container_name: grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    mem_limit: 512m
    volumes:
      - ./volumes/grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [streaming]

  # ==========================================
  # PRODUCERS (one image, one process each)
  # ==========================================
  yahoo-producer:
    <<: *producer
    container_name: yahoo-producer
    command: python -m src.equities.yahoo_producer
    # Sharding is opt-in here only: fundamentals/insider/corporate run whole.
    environment:
      <<: *producer-env
      SYMBOLS_SHARD: ${SYMBOLS_SHARD:-}

  index-producer:
    <<: *producer
    container_name: index-producer
    command: python -m src.equities.index_producer

  binance-producer:
    <<: *producer
    container_name: binance-producer
    command: python -m src.crypto.binance_ws_producer

  binance-ohlcv-producer:
    <<: *producer
    container_name: binance-ohlcv-producer
    command: python -m src.crypto.binance_ohlcv_producer

  forex-producer:
    <<: *producer
    container_name: forex-producer
    command: python -m src.forex.forex_producer

  coingecko-producer:
    <<: *producer
    container_name: coingecko-producer
    command: python -m src.crypto.coingecko_producer

  sec-edgar-producer:
    <<: *producer
    container_name: sec-edgar-producer
    command: python -m src.equities.sec_edgar_producer
    environment:
      KAFKA_BROKER: *kafka-brokers
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}

  corporate-actions-producer:
    <<: *producer
    container_name: corporate-actions-producer
    command: python -m src.equities.corporate_actions_producer

  fundamentals-producer:
    <<: *producer
    container_name: fundamentals-producer
    command: python -m src.equities.fundamentals_producer

  insider-producer:
    <<: *producer
    container_name: insider-producer
    command: python -m src.equities.insider_producer

  bls-producer:
    <<: *producer
    container_name: bls-producer
    command: python -m src.macro.bls_producer

  treasury-producer:
    <<: *producer
    container_name: treasury-producer
    command: python -m src.macro.treasury_producer

  commodities-producer:
    <<: *producer
    container_name: commodities-producer
    command: python -m src.macro.commodities_producer

  # Synthetic load for scaling tests: make load RATE=500 DURATION=60
  loadgen:
    <<: *producer
    container_name: loadgen
    profiles: [load]
    restart: "no"
    command: python -m src.loadgen --rate 500 --duration 60

  # ==========================================
  # FLINK CLUSTER
  # ==========================================
  jobmanager:
    build: ./flink-jobs
    image: flink-jobs:local
    pull_policy: build
    container_name: jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10 s
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [streaming]

  taskmanager:
    build: ./flink-jobs
    image: flink-jobs:local
    pull_policy: build
    container_name: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    networks: [streaming]

  # One-shot job submission. Re-runs safely: it exits if a job is already
  # running instead of submitting a duplicate.
  flink-submit:
    build: ./flink-jobs
    image: flink-jobs:local
    pull_policy: build
    container_name: flink-submit
    depends_on:
      jobmanager:
        condition: service_healthy
    restart: "no"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for _ in $(seq 1 60); do
          flink list -m jobmanager:8081 >/dev/null 2>&1 && break
          echo "waiting for Flink REST API"; sleep 2
        done
        if [ "$(flink list -r -m jobmanager:8081 2>/dev/null | grep -c RUNNING)" -gt 0 ]; then
          echo "job already running; skipping submission"; exit 0
        fi
        flink run -d -m jobmanager:8081 \
          -py /opt/flink/usrlib/src/job_kafka_to_clickhouse.py \
          --pyFiles /opt/flink/usrlib/src/transforms.py,/opt/flink/usrlib/src/config.py
    networks: [streaming]

networks:
  streaming:
    driver: bridge

volumes:
  clickhouse_data:
