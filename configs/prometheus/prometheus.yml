global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
